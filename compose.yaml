services:
  nextjs:
    # next / server は同一の開発イメージを共有する（中身が一致するため）。
    # 両サービスに同じ build を指定すると、片方のビルドで pnpm install が走り
    # もう片方は全レイヤがキャッシュヒットするので install は実質1回で済む。
    # image を共有しつつ build も両方に残すのは、lockfile 変更時の watch rebuild を
    # 両サービスで効かせるため（image だけ共有だと server 側の rebuild が機能しない）。
    build:
      dockerfile: ./Dockerfile.dev
    image: girls-side-analysis-dev
    container_name: girls-side-analysis-nextjs-dev
    working_dir: /workspace/next
    command: ['pnpm', 'dev']
    environment:
      TZ: 'Asia/Tokyo'
    env_file:
      - next/.env.development
      - next/.env.local
    ports:
      - 3000:3000
    depends_on:
      server:
        condition: service_started
    # bind mount をやめ docker compose watch でソースを同期する。
    # virtiofs のイベント取りこぼしが無くなり HMR が安定、FS もコンテナネイティブで高速。
    develop:
      watch:
        - action: sync
          path: ./next
          target: /workspace/next
          ignore:
            - node_modules/
            - .next/
        # next は server-ts/client (Hono RPC) を import するので server-ts も同期する
        - action: sync
          path: ./server-ts
          target: /workspace/server-ts
          ignore:
            - node_modules/
            - dist/
        # biome.jsonc はイメージに焼き込まれる（Dockerfile.dev の COPY）ため、
        # 同期しないとホストで編集しても `pnpm lint` の結果が変わらない。
        # ⚠️ 設定が壊れていても biome はエラーにせず既定設定にフォールバックし、
        # .next/ のビルド生成物まで lint し始めるので、変更したら結果を必ず見ること。
        - action: sync
          path: ./biome.jsonc
          target: /workspace/biome.jsonc
        - action: rebuild
          path: ./pnpm-lock.yaml

  server:
    # nextjs と同一イメージ（girls-side-analysis-dev）を共有する。build を同じく
    # 指定するのは lockfile 変更時の watch rebuild を効かせるためで、nextjs の
    # ビルド成果がキャッシュされるため実際のビルドコストは発生しない。
    build:
      dockerfile: ./Dockerfile.dev
    image: girls-side-analysis-dev
    container_name: girls-side-analysis-server
    command: ['pnpm', 'dev']
    env_file:
      - ./server-ts/.env.development
    environment:
      TZ: 'Asia/Tokyo'
    working_dir: /workspace/server-ts
    ports:
      - 4000:3000
    depends_on:
      database:
        condition: service_healthy
    # tsx watch が自前で再起動するため sync のみ（コンテナ全体の restart は不要）
    develop:
      watch:
        - action: sync
          path: ./server-ts
          target: /workspace/server-ts
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./pnpm-lock.yaml

  # lint 専用の使い捨てサービス（`pnpm lint` から docker compose run で起動する）。
  # nextjs / server と同じイメージを使うが、**env_file / ports / depends_on を持たない**。
  # アプリ用の env（`next/.env.*` は gitignore 対象）が無い clone 直後の環境でも、
  # dev スタックが停止していても lint を実行できるようにするため。
  # ソースはイメージ内のコピーではなくホストの作業ツリーを bind mount して見る
  # （compose watch の sync はホスト → コンテナの一方向で、`pnpm dev` を動かして
  #  いない間はイメージ側が古いままになるため）。
  # profiles を付けて `docker compose up` では起動しないようにする
  # （`docker compose run` は対象サービスの profile を自動で有効化する）。
  lint:
    build:
      dockerfile: ./Dockerfile.dev
    image: girls-side-analysis-dev
    profiles: ['tools']
    working_dir: /repo
    volumes:
      - ./:/repo

  database:
    image: mysql:8.4
    container_name: girls-side-analysis-database
    env_file:
      - ./server-ts/.env.development
    # 開発 DB は named volume で永続化する。スキーマ反映/初期データ投入は
    # one-shot サービスではなく `pnpm db:migrate` / `pnpm db:seed` で行う。
    volumes:
      - db-data:/var/lib/mysql
    environment:
      TZ: 'Asia/Tokyo'
      LANG: 'ja_JP.UTF-8'
    ports:
      - 3306:3306
    cap_add:
      - SYS_NICE
    healthcheck:
      test: mysql -u $$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e "select 1;"
      interval: 5s
      timeout: 30s
      retries: 4
      start_period: 5s

volumes:
  db-data:

networks:
  default:
    name: girls-side-analysis-network
