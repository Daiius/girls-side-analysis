# ローカル dev（`pnpm dev`）とリモート dev 公開（`pnpm dev:remote`）で compose を分けない。
# 単一の compose.yaml を環境変数でパラメータ化し、remote 差分は `.env.remote` に集約する
# （雛形は `.env.remote.example`。`pnpm dev:remote` = `docker compose --env-file .env.remote ...`）。
#
#   | 差分            | ローカル既定            | remote（.env.remote）           |
#   |-----------------|-------------------------|---------------------------------|
#   | next の公開      | 3000（全 IF）           | NEXT_BIND=127.0.0.1:8401 等     |
#   | server の公開    | 4000（全 IF）           | SERVER_BIND=127.0.0.1:4000      |
#   | 公開オリジン      | http://localhost:3000   | PUBLIC_ORIGIN=https://<host>    |
#
# ⚠️ **compose の `environment:` は `env_file:` より優先される。** 下で HOST_URL /
# BETTER_AUTH_URL を書いているため、dev スタックにおける公開オリジンの原典は
# `next/.env.development` ではなく**この compose（＝ PUBLIC_ORIGIN）**である。
# 既定値はローカルの従来値と同一なので、`pnpm dev` の挙動は変わらない。
services:
  nextjs:
    # next / server は同一の開発イメージを共有する（中身が一致するため）。
    # 両サービスに同じ build を指定すると、片方のビルドで pnpm install が走り
    # もう片方は全レイヤがキャッシュヒットするので install は実質1回で済む。
    # image を共有しつつ build も両方に残すのは、lockfile 変更時の watch rebuild を
    # 両サービスで効かせるため（image だけ共有だと server 側の rebuild が機能しない）。
    build:
      dockerfile: ./Dockerfile.dev
    image: girls-side-analysis-dev
    container_name: girls-side-analysis-nextjs-dev
    working_dir: /workspace/next
    command: ['pnpm', 'dev']
    environment:
      TZ: 'Asia/Tokyo'
      # 公開オリジン。remote 公開時のみ .env.remote から入る。
      # next.config.ts がこれを見て allowedDevOrigins にホスト名を足す
      # （足さないと /_next/* と HMR の WebSocket が 403 になる）。
      PUBLIC_ORIGIN: '${PUBLIC_ORIGIN:-}'
      # metadataBase / canonical / sitemap / OGP / シェア文言に使う自身の公開 URL。
      # ⚠️ env_file より優先されるので、既定値は next/.env.development と同じ値にしてある。
      HOST_URL: '${PUBLIC_ORIGIN:-http://localhost:3000}'
    env_file:
      - next/.env.development
      - next/.env.local
    ports:
      # ローカルは 3000 を全 IF に公開。remote は .env.remote の NEXT_BIND で
      # 前段プロキシ向けに loopback の 1 ポートだけ公開する（唯一の外向きの口）。
      - '${NEXT_BIND:-3000}:3000'
    depends_on:
      server:
        condition: service_started
    # bind mount をやめ docker compose watch でソースを同期する。
    # virtiofs のイベント取りこぼしが無くなり HMR が安定、FS もコンテナネイティブで高速。
    develop:
      watch:
        - action: sync
          path: ./next
          target: /workspace/next
          ignore:
            - node_modules/
            - .next/
        # next は server-ts/client (Hono RPC) を import するので server-ts も同期する
        - action: sync
          path: ./server-ts
          target: /workspace/server-ts
          ignore:
            - node_modules/
            - dist/
        # biome.jsonc はイメージに焼き込まれる（Dockerfile.dev の COPY）ため、
        # 同期しないとホストで編集しても `pnpm lint` の結果が変わらない。
        # ⚠️ 設定が壊れていても biome はエラーにせず既定設定にフォールバックし、
        # .next/ のビルド生成物まで lint し始めるので、変更したら結果を必ず見ること。
        - action: sync
          path: ./biome.jsonc
          target: /workspace/biome.jsonc
        - action: rebuild
          path: ./pnpm-lock.yaml

  server:
    # nextjs と同一イメージ（girls-side-analysis-dev）を共有する。build を同じく
    # 指定するのは lockfile 変更時の watch rebuild を効かせるためで、nextjs の
    # ビルド成果がキャッシュされるため実際のビルドコストは発生しない。
    build:
      dockerfile: ./Dockerfile.dev
    image: girls-side-analysis-dev
    container_name: girls-side-analysis-server
    command: ['pnpm', 'dev']
    env_file:
      - ./server-ts/.env.development
    environment:
      TZ: 'Asia/Tokyo'
      # フロントエンドの origin。better-auth の baseURL / trustedOrigins と
      # Hono の CORS 許可オリジンに使われる（src/lib/auth.ts, src/app.ts）。
      # ⚠️ env_file より優先されるので、既定値は server-ts/.env.development と同じ値。
      BETTER_AUTH_URL: '${PUBLIC_ORIGIN:-http://localhost:3000}'
    working_dir: /workspace/server-ts
    ports:
      # remote では SERVER_BIND=127.0.0.1:4000 として外から届かないようにする。
      # ブラウザは next の rewrites 経由で /api/auth/* に届くので、直接の口は要らない。
      - '${SERVER_BIND:-4000}:3000'
    depends_on:
      database:
        condition: service_healthy
    # tsx watch が自前で再起動するため sync のみ（コンテナ全体の restart は不要）
    develop:
      watch:
        - action: sync
          path: ./server-ts
          target: /workspace/server-ts
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./pnpm-lock.yaml

  # lint 専用の使い捨てサービス（`pnpm lint` から docker compose run で起動する）。
  # nextjs / server と同じイメージを使うが、**env_file / ports / depends_on を持たない**。
  # アプリ用の env（`next/.env.*` は gitignore 対象）が無い clone 直後の環境でも、
  # dev スタックが停止していても lint を実行できるようにするため。
  # ソースはイメージ内のコピーではなくホストの作業ツリーを bind mount して見る
  # （compose watch の sync はホスト → コンテナの一方向で、`pnpm dev` を動かして
  #  いない間はイメージ側が古いままになるため）。
  # profiles を付けて `docker compose up` では起動しないようにする
  # （`docker compose run` は対象サービスの profile を自動で有効化する）。
  lint:
    build:
      dockerfile: ./Dockerfile.dev
    image: girls-side-analysis-dev
    profiles: ['tools']
    working_dir: /repo
    volumes:
      - ./:/repo

  database:
    image: mysql:8.4
    container_name: girls-side-analysis-database
    env_file:
      - ./server-ts/.env.development
    # 開発 DB は named volume で永続化する。スキーマ反映/初期データ投入は
    # one-shot サービスではなく `pnpm db:migrate` / `pnpm db:seed` で行う。
    volumes:
      - db-data:/var/lib/mysql
    environment:
      TZ: 'Asia/Tokyo'
      LANG: 'ja_JP.UTF-8'
    # ⚠️ ホストへの publish は意図的に持たない。DB へは compose ネットワーク内
    # （nextjs / server から `database:3306`）だけで届けばよく、`pnpm db:*` も
    # すべて `docker compose exec server` 経由で動く。
    # GUI クライアント等で覗きたいときは、その場で `docker compose exec database mysql`
    # を使うか、一時的に `compose.override.yaml`（gitignore 済み）で publish する。
    cap_add:
      - SYS_NICE
    healthcheck:
      test: mysql -u $$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e "select 1;"
      interval: 5s
      timeout: 30s
      retries: 4
      start_period: 5s

volumes:
  db-data:

networks:
  default:
    name: girls-side-analysis-network
